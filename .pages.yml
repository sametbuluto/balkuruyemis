# Yerel prototip; hesap/CI henüz bağlı değil. docs/CMS_ADAPTER.md
media:
  - name: products
    label: Ürün fotoğrafları
    input: public/images/products
    output: /images/products
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: random
  - name: categories
    label: Kategori fotoğrafları
    input: public/images/categories
    output: /images/categories
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: random
  - name: branches
    label: Şube fotoğrafları
    input: public/images/branches
    output: /images/branches
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: random
  - name: gallery
    label: Ana sayfa ve galeri
    input: public/images/gallery
    output: /images/gallery
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: random
content:
  - name: products
    label: Ürünler
    type: collection
    path: content/products
    format: json
    subfolders: false
    exclude:
      - .gitkeep
      - .DS_Store
    operations:
      create: true
      rename: false
      delete: false
    filename:
      template: product-{fields.editorKey}.json
      field: false
    view:
      primary: name
      sort:
        - sortOrder
      default:
        sort: sortOrder
        order: asc
    fields:
      - name: editorKey
        label: Otomatik kayıt anahtarı
        type: uuid
        hidden: true
        required: true
        options:
          editable: false
          generate: false
      - name: name
        label: Ürün adı
        type: string
        required: true
        pattern:
          regex: \S
          message: Boş bırakmayın.
        options:
          maxlength: 120
      - name: categoryId
        label: Kategori seçin
        type: reference
        required: true
        options:
          collection: categories
          value: '{fields.id}'
          label: '{fields.name}'
          search: name
      - name: description
        label: Ürün açıklaması
        type: text
        required: true
        pattern:
          regex: \S
          message: Boş bırakmayın.
        options:
          maxlength: 1200
      - name: images
        label: Fotoğraflar
        type: object
        list: true
        default: []
        fields:
          - name: url
            label: Fotoğraf seçin
            type: image
            required: true
            options:
              media: products
              extensions:
                - jpg
                - jpeg
                - png
                - webp
                - avif
              rename: random
          - name: alt
            label: Fotoğrafta ne var? Türkçe açıklama
            type: string
            required: true
            pattern:
              regex: \S
              message: Boş bırakmayın.
            options:
              maxlength: 320
          - name: status
            label: Yayın durumu
            type: select
            required: true
            default: published
            options:
              values:
                - value: draft
                  label: Taslak
                - value: published
                  label: Yayında
          - name: sortOrder
            label: Sıra
            type: number
            required: true
            default: 0
            options:
              min: 0
              step: 1
      - name: sortOrder
        label: Sıra
        type: number
        required: true
        default: 0
        options:
          min: 0
          step: 1
      - name: status
        label: Yayın durumu
        type: select
        required: true
        default: draft
        options:
          values:
            - value: draft
              label: Taslak
            - value: published
              label: Yayında
